{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>REX CC - Admin | 404</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
              rel="stylesheet">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
              rel="stylesheet">
        <style>
            :root {
                --admin-bg: #f5f5f5;
                --admin-sidebar-bg: #1a1a1a;
                --admin-text-primary: #000000;
                --admin-text-secondary: #666666;
                --admin-text-light: #999999;
                --admin-border: #e0e0e0;
                --admin-white: #ffffff;
                --font-head: "Playfair Display", serif;
                --font-body: "Montserrat", sans-serif;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-body);
                background: var(--admin-bg);
                color: var(--admin-text-primary);
                min-height: 100vh;
                display: flex;
            }

            /* Sidebar (static, simplified) */
            .error-sidebar {
                width: 260px;
                background-color: var(--admin-sidebar-bg);
                color: var(--admin-white);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                flex-shrink: 0;
            }

            .sidebar-logo {
                text-align: center;
            }

            .logo-main {
                font-family: var(--font-head);
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: 3px;
                color: var(--admin-white);
            }

            .logo-accent {
                color: var(--admin-text-light);
            }

            .logo-sub {
                display: block;
                margin-top: 10px;
                background-color: var(--admin-white);
                color: var(--admin-sidebar-bg);
                font-size: 0.6rem;
                font-weight: 600;
                letter-spacing: 3px;
                padding: 5px 18px;
                text-transform: uppercase;
                font-family: var(--font-body);
            }

            /* Main content */
            .error-main {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px;
            }

            .error-content {
                text-align: center;
                max-width: 500px;
            }

            /* Error code */
            .error-code {
                font-family: var(--font-head);
                font-size: 120px;
                font-weight: 700;
                line-height: 1;
                letter-spacing: 6px;
                color: var(--admin-text-primary);
                margin-bottom: 10px;
                opacity: 0.08;
            }

            .error-icon {
                margin-top: -30px;
                margin-bottom: 24px;
            }

            .error-icon .material-icons {
                font-size: 48px;
                color: var(--admin-text-light);
            }

            .error-label {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: var(--admin-text-light);
                margin-bottom: 12px;
            }

            .error-title {
                font-family: var(--font-head);
                font-size: 24px;
                font-weight: 600;
                color: var(--admin-text-primary);
                margin-bottom: 12px;
            }

            .error-description {
                font-size: 14px;
                color: var(--admin-text-secondary);
                line-height: 1.7;
                margin-bottom: 36px;
            }

            /* Actions */
            .error-actions {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
            }

            .error-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 28px;
                font-family: var(--font-body);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 1px;
                text-transform: uppercase;
                text-decoration: none;
                border: none;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .error-btn-primary {
                background: var(--admin-sidebar-bg);
                color: var(--admin-white);
            }

            .error-btn-primary:hover {
                background: #333;
            }

            .error-btn-outline {
                background: transparent;
                color: var(--admin-text-primary);
                border: 1px solid var(--admin-border);
            }

            .error-btn-outline:hover {
                border-color: var(--admin-text-primary);
            }

            .error-btn .material-icons {
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <aside class="error-sidebar">
            <div class="sidebar-logo">
                <span class="logo-main">REX <span class="logo-accent">CC</span></span>
                <span class="logo-sub">ADMIN</span>
            </div>
        </aside>
        <main class="error-main">
            <div class="error-content">
                <div class="error-code">404</div>
                <div class="error-icon">
                    <span class="material-icons">search_off</span>
                </div>
                <p class="error-label">Page Not Found</p>
                <h1 class="error-title">Resource Not Found</h1>
                <p class="error-description">
                    The admin page you're trying to access doesn't exist or has been moved.
                    Please check the URL or navigate back to the dashboard.
                </p>
                <div class="error-actions">
                    <a href="{% url 'admin_dashboard' %}" class="error-btn error-btn-primary">
                        <span class="material-icons">grid_view</span>
                        Dashboard
                    </a>
                    <a href="javascript:history.back()" class="error-btn error-btn-outline">
                        <span class="material-icons">arrow_back</span>
                        Go Back
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
