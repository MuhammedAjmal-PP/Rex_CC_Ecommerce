# docker-compose.yml — Local Development Only
# Secrets are loaded from your .env file via ${VARIABLE} substitution.
# Docker Compose reads .env automatically — no credentials are hardcoded here.
# .env is listed in .gitignore so it is NEVER committed to git.

name: rexcc

services:

  # ────────────────────────────────────────────
  # 1. DATABASE (PostgreSQL)
  # ────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: rexcc-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount at /var/lib/postgresql for PostgreSQL 18+ compatibility
    ports:
      - "5433:5432"
      # Mapped to 5433 on your machine to avoid conflicts with a local PostgreSQL on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────
  # 2. WEB (Django dev server)
  # ────────────────────────────────────────────
  web:
    build: .
    image: rexcc:latest
    container_name: rexcc-web
    restart: always
    env_file:
      - .env
    environment:
      # Override DATABASE_URL: inside Docker 'localhost' means the container itself.
      # Use the 'db' service name so Django can reach the database container.
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - .:/app    # Bind-mount for hot-reload — code changes reflect immediately
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────
  # 3. WORKER (Background Task Processor)
  # ────────────────────────────────────────────
  worker:
    image: rexcc:latest
    container_name: rexcc-worker
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    entrypoint: []
    command: python manage.py db_worker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

# ────────────────────────────────────────────
# NAMED VOLUMES
# ────────────────────────────────────────────
volumes:
  postgres_data:
