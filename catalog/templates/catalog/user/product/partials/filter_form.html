<form method="get">
    {% if search_query %}<input type="hidden" name="search" value="{{ search_query }}">{% endif %}
    {% if sort %}<input type="hidden" name="sort" value="{{ sort }}">{% endif %}
    <!-- CATEGORY -->
    <div class="filter-group">
        <h4 class="filter-group-title">Category</h4>
        {% for cat in categories %}
            <label class="filter-option">
                <input type="checkbox"
                       name="category"
                       value="{{ cat.slug }}"
                       {% if cat.slug in selected_categories %}checked{% endif %}>
                <span class="filter-option-label">
                    <span class="filter-checkbox"></span>
                    {{ cat.name }}
                </span>
            </label>
        {% endfor %}
    </div>
    <!-- BRAND -->
    <div class="filter-group">
        <h4 class="filter-group-title">Brand</h4>
        {% for br in brands %}
            <label class="filter-option">
                <input type="checkbox"
                       name="brand"
                       value="{{ br.slug }}"
                       {% if br.slug in selected_brands %}checked{% endif %}>
                <span class="filter-option-label">
                    <span class="filter-checkbox"></span>
                    {{ br.name }}
                </span>
            </label>
        {% endfor %}
    </div>
    <!-- PRICE -->
    <div class="filter-group">
        <h4 class="filter-group-title">Price Range</h4>
        <div class="price-range">
            <input type="number"
                   name="min_price"
                   placeholder="Min"
                   value="{{ min_price }}">
            <input type="number"
                   name="max_price"
                   placeholder="Max"
                   value="{{ max_price }}">
        </div>
    </div>
    <button type="submit" class="filter-apply-btn w-100">Apply Filters</button>
    {% if has_filters %}
        <a href="{% url 'product_list' %}"
           class="btn btn-link w-100 mt-2 text-decoration-none text-muted"
           style="font-size: 0.8rem">Clear Filters</a>
    {% endif %}
</form>
