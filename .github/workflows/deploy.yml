# ─────────────────────────────────────────────
# CI/CD Pipeline — Deploy to AWS EC2
# ─────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production          # ← enables GitHub environment protection rules

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e                   # stop immediately if any command fails

            cd ${{ secrets.PROJECT_DIR }}

            echo "▶ Pulling latest code..."
            git pull origin main
            # EC2's Dockerfile, docker-compose.yml, nginx/, .env are protected
            # via .git/info/exclude — git pull won't touch them

            echo "▶ Rebuilding containers..."
            docker compose build --no-cache

            echo "▶ Restarting services..."
            docker compose up -d --remove-orphans

            echo "▶ Running migrations..."
            docker compose exec -T web python manage.py migrate --noinput

            echo "▶ Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput

            echo "▶ Verifying containers..."
            docker compose ps

            echo "✅ Deployment complete!"