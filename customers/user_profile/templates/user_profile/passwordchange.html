<div class="modal fade"
     id="changePasswordModal"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg password-modal-content">
            <!-- Modal Header -->
            <div class="modal-header password-modal-header">
                <h5 class="modal-title password-modal-title">Change Password</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <!-- Modal Body -->
            <form method="POST" action="{% url 'change_password' %}">
                {% csrf_token %}
                <div class="modal-body password-modal-body">
                    <!-- Old Password -->
                    <div class="form-floating mb-3">
                        <input type="password"
                               name="old_password"
                               class="form-control password-form-control {% if form.old_password.errors %}is-invalid{% endif %}"
                               id="oldPasswordInput"
                               placeholder="Current Password"
                               required>
                        <label for="oldPasswordInput" class="text-muted">Current Password</label>
                        {% for error in form.old_password.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
                    </div>
                    <!-- New Password -->
                    <div class="form-floating mb-3">
                        <input type="password"
                               name="new_password1"
                               class="form-control password-form-control {% if form.new_password1.errors %}is-invalid{% endif %}"
                               id="newPassword1Input"
                               placeholder="New Password"
                               required>
                        <label for="newPassword1Input" class="text-muted">New Password</label>
                        {% for error in form.new_password1.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
                    </div>
                    <!-- Confirm Password -->
                    <div class="form-floating">
                        <input type="password"
                               name="new_password2"
                               class="form-control password-form-control {% if form.new_password2.errors %}is-invalid{% endif %}"
                               id="newPassword2Input"
                               placeholder="Confirm New Password"
                               required>
                        <label for="newPassword2Input" class="text-muted">Confirm New Password</label>
                        {% for error in form.new_password2.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
                    </div>
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer password-modal-footer">
                    <button type="button"
                            class="btn btn-outline-secondary btn-cancel"
                            data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-dark btn-update-password">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% if show_password_modal %}
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var myModal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
        myModal.show();
    });
    </script>
{% endif %}
