{% extends "account/base.html" %}
{% load i18n %}

{% block head_title %}{% trans "Password Changed" %} | REX CC{% endblock %}

{% block content %}
<div class="auth-icon auth-icon-success">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
</div>

<h1 class="auth-title">Password Changed</h1>
<p class="auth-subtitle">Your password has been successfully changed. You can now sign in with your new password.</p>

<div class="auth-links" style="margin-top: 30px;">
    <a href="{% url 'account_login' %}" class="btn btn-primary" style="display: inline-block; text-decoration: none;">
        {% trans "Sign In Now" %}
    </a>
</div>
{% endblock %}
