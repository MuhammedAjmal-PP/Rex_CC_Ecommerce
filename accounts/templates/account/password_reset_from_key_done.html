{% extends "account/base.html" %}
{% load i18n %}

{% block head_title %}{% trans "Password Changed" %} | REX CC{% endblock %}

{% block content %}
<div class="auth-icon auth-icon-success">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
</div>

<h1 class="auth-title">Password Changed</h1>
<p class="auth-subtitle">
    Your password has been successfully reset.
    You can now sign in with your new password.
</p>

<a href="{% url 'account_login' %}" class="btn-primary"
    style="display: block; text-decoration: none; text-align: center;">
    {% trans "Sign In Now" %}
</a>
{% endblock %}
