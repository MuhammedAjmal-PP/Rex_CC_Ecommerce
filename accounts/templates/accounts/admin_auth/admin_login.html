{% extends 'accounts/admin_auth/admin_base.html' %}
{% block head_title %}Admin Login | REX CC{% endblock %}
{% block content %}
    <h1 class="admin-welcome">Admin Portal</h1>
    <p class="auth-subtitle">Access your administrative dashboard</p>
    <form method="POST" class="auth-form">
        {% csrf_token %}
        <div>
            <label for="id_email">Admin Email</label>
            <input type="email"
                   id="id_email"
                   name="username"
                   required
                   placeholder="admin@rexcc.com">
        </div>
        <div>
            <label for="id_password">Admin Password</label>
            <div class="password-input-wrapper">
                <input type="password"
                       id="id_password"
                       name="password"
                       required
                       placeholder="Enter admin password">
                <button type="button"
                        class="password-toggle"
                        aria-label="Toggle password visibility">
                    <svg class="eye-icon"
                         width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary">Access Dashboard</button>
    </form>
    <div class="auth-links">
        <a href="{% url 'admin_forgot_password' %}">Reset Admin Password</a>
    </div>
{% endblock %}
