{% extends 'accounts/admin_auth/admin_base.html' %}

{% block head_title %}Reset Admin Password | REX CC{% endblock %}

{% block content %}
  <h1 class="auth-title">Password Recovery</h1>
  <p class="auth-subtitle">Enter your admin email to receive a password reset link</p>

  <form method="POST" class="auth-form">
    {% csrf_token %}

    <div>
      <label for="id_email">Admin Email Address</label>
      <input type="email" id="id_email" name="email" required placeholder="admin@rexcc.com">
    </div>

    <button type="submit" class="btn-primary">Send Reset Link</button>
  </form>

  <div class="auth-links-bottom">
    <span class="auth-prompt">Remember your credentials?</span>
    <a href="{% url 'admin_login' %}" class="auth-link-accent">Return to Login</a>
  </div>
{% endblock %}
