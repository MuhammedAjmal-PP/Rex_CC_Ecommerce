# Upstream = where Nginx sends requests to.
# "web" is the name of the Django container in docker-compose.yml.
# Docker's internal DNS resolves "web" to the container's IP automatically.
upstream django {
    server web:8000;
}

server {
    # Listen on port 80 (standard HTTP port)
    listen 80;

    # For local testing, accept any hostname.
    # On production, this will be: rexcc.muhammedajmal.online
    server_name localhost;

    # Maximum upload size (for product images in admin)
    # WHY 10M? Product images can be up to 5MB, plus form data
    client_max_body_size 10M;

    # ─── Static Files ───
    # When the browser requests /static/..., Nginx serves directly from
    # the staticfiles/ folder WITHOUT touching Django. Much faster!
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;                  # Browser caches for 30 days
        add_header Cache-Control "public, immutable";
    }

    # ─── Everything Else → Django ───
    # All other URLs (homepage, admin, API, etc.) get forwarded to Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for slow operations (PDF generation, etc.)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}